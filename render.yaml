services:
  - type: web
    name: habitflow-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --no-package-lock
    startCommand: sh -c "npx prisma generate && npm run build && npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PRISMA_SKIP_POSTINSTALL_GENERATE
        value: "true"
